name: Infra

on:
  pull_request:
    branches: [master]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [master]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Bicep lint + what-if
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep build (lint)
        run: az bicep build --file infra/main.bicep

      - name: Sign in to Azure
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
                         internalApiKey='${{ secrets.INTERNAL_API_KEY }}' \
                         jwtSigningKey='${{ secrets.JWT_SIGNING_KEY }}'
